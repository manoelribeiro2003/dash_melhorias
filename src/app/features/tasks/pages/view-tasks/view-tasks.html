<div class="main">

    <div class="cards-container-status">
        @for (cardValue of cardValues; track cardValue) {
        <app-card-status-tasks [status]="cardValue.status" [value]="cardValue.status === 'TotalDeProjetos'
            ? projetos.length
            : cardValue.atrasado
                ? projetos.filter(projeto => projeto.atrasado == true).length
                : projetos.filter(projeto => projeto.status === cardValue.status).length" [icon]="cardValue.icon"
            [title]="cardValue.title" [itensConcluidos]=" !cardValue.atrasado
            ? projetos.filter(projeto => projeto.status == cardValue.status).length
            : projetos.filter(projeto => projeto.atrasado == true).length" [totalItens]="projetos.length" />
        }
    </div>

    <div class="div-grid">
        <div class="celula-cabecalho">
            <span class="conteudo-cabecalho">Responsável</span>
        </div>
        <div class="celula-cabecalho">
            <span class="conteudo-cabecalho">Progresso da Semana</span>
        </div>
        <div class="celula-cabecalho">
            <span class="conteudo-cabecalho">Atividades da Semana</span>
        </div>
        <div class="celula-cabecalho">
            <span class="conteudo-cabecalho">Prazo</span>
        </div>
        <div class="celula-cabecalho">
            <span class="conteudo-cabecalho">Status</span>
        </div>
    </div>
</div>
