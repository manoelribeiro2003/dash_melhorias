<div class="main">
    <div class="app-card-status-container">
        @for (cardValue of cardValues; track cardValue) {
        <app-card-status
            [status]="cardValue.status"
            [value]="cardValue.status === 'TotalDeProjetos'
            ? tarefas().length
            : cardValue.atrasado
                ? tarefas().filter(tarefa => tarefa.atrasado == true).length
                : tarefas().filter(tarefa => tarefa.status === cardValue.status).length"
            [icon]="cardValue.icon" 
            [title]="cardValue.title"
            [itensConcluidos]=" !cardValue.atrasado
            ? tarefas().filter(tarefa => tarefa.status == cardValue.status).length
            : tarefas().filter(tarefa => tarefa.atrasado == true).length"
            [totalItens]="tarefas().length" />
        }
    </div>
    <div class="app-projects-card-container">
        <app-projects-card/>
    </div>
</div>
