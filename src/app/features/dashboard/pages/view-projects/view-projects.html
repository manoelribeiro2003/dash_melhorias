<div class="main">
    <div class="app-card-status-container">
        @for (cardValue of cardValues; track cardValue) {
        <app-card-status
            [status]="cardValue.status"
            [value]="cardValue.status === 'TotalDeProjetos'? tarefas().length: tarefas().filter(tarefa => tarefa.status === cardValue.status).length"
            [icon]="cardValue.icon" 
            [title]="cardValue.title"
            [itensConcluidos]="tarefas().filter(tarefa => tarefa.status == cardValue.status).length"
            [totalItens]="tarefas().length" />
        }
    </div>
    <div class="app-projects-card-container">
        <app-projects-card></app-projects-card>
    </div>
</div>
