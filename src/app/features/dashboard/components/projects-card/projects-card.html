<mat-card appearance="filled">
  <mat-card-header>
    <div class="filtros">

      <div class="div-categoria">
        <mat-form-field appearance="outline">
          <mat-label>Filtrar por categoria</mat-label>

          <mat-select [(value)]="catSelecionada">
            @for (categoria of categorias; track categoria) {
            <mat-option [value]="categoria">
              {{ categoria ?? 'Sem Categoria' }}
            </mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>

      <div class="botoes-filtro">
        <mat-button-toggle-group name="botoes-filtro" [(value)]="statusSelecionado">

          @for (status of status(); track status) {
          <mat-button-toggle [value]="status.value" [checked]="status.value === 'Em andamento'">
            {{ status.label }}
          </mat-button-toggle>
          }

        </mat-button-toggle-group>
      </div>

    </div>
  </mat-card-header>
  <mat-card-actions>
    <app-table-projects [filtroCategoria]="catSelecionada()" [filtroStatus]="statusSelecionado()" />
  </mat-card-actions>
</mat-card>
