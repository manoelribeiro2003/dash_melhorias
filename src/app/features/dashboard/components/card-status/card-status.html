<mat-card class="project-card">
  <mat-card-content>
    <div class="card-header">
      <div class="card-icon">
        <mat-icon [svgIcon]="icon()" aria-hidden="true"/>
      </div>
      <div class="card-info">
        <span class="card-title">{{ title() }}</span>
        <span class="card-value">{{ value() }}</span>
      </div>
    </div>
  </mat-card-content>
</mat-card>
